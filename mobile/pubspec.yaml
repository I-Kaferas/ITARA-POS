name: pos_mobile
description: POS Professional System - Offline-first mobile terminal.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  crypto: ^3.0.6
  mobile_scanner: ^7.0.1
  barcode_widget: ^2.0.4
  printing: ^5.14.2
  pdf: ^3.13.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.5.34
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  logger: ^2.5.0
  archive: ^4.0.9
  # mDNS / DNS-SD — Master advertise + Slave browse (_itara-pos._tcp)
  nsd: ^4.0.3
  desktop_multi_window: ^0.3.1
  screen_retriever: ^0.2.2
  window_manager: ^0.5.2
  print_bluetooth_thermal: ^1.2.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  # Drift local database — full implementation in Phase 36
  # drift: ^2.28.0
  # drift_flutter: ^0.2.4
  # sqlite3_flutter_libs: ^0.5.34
  # path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # drift_dev: ^2.28.0
  # build_runner: ^2.6.0

flutter:
  uses-material-design: true
  assets:
    # IBM Plex, bundled so the terminal renders identically offline (see main.dart).
    - assets/google_fonts/
    - assets/images/
