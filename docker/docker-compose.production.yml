services:
  postgres:
    image: postgres:16-alpine
    container_name: pos_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pos}
      POSTGRES_USER: ${DB_USERNAME:-pos}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pos_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - pos_network

  minio:
    image: minio/minio:latest
    container_name: pos_minio_prod
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    networks:
      - pos_network

  app:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: pos_app_prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos_network

  queue:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: pos_queue_prod
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - app
    networks:
      - pos_network

  scheduler:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: pos_scheduler_prod
    restart: always
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
    depends_on:
      - app
    networks:
      - pos_network

  nginx:
    image: nginx:alpine
    container_name: pos_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend/public:/var/www/html/public:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
